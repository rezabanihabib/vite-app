<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body
    class="flex items-center justify-center min-h-screen flex-col gap-10 pb-20"
  >
    <!-- <div x-data="{ number: 5 }">
      <div x-data="{ count: 10 }" x-modelable="count" x-model="number">
        <button @click="count++">Increment</button>
      </div>

      Number: <span x-text="number"></span>
    </div> -->

    <ul
      class="flex items-center justify-center gap-2 bg-amber-300"
      x-data="{ colors: ['Red', 'Orange', 'Yellow'] }"
    >
      <template x-for="color in colors">
        <li x-text="color"></li>
      </template>
    </ul>

    <ul
      x-data="{ car: { make: 'Jeep', model: 'Grand Cherokee', color: 'Black' } }"
    >
      <template x-for="(value, prop) in car">
        <li><span x-text="prop"></span>: <span x-text="value"></span></li>
      </template>
    </ul>

    <ul
      x-data="{ colors: [
            { id: 1, label: 'Red' },
            { id: 2, label: 'Orange' },
            { id: 3, label: 'Yellow' },
        ]}"
    >
      <template x-for="color in colors" :key="color.id">
        <li x-text="color.label"></li>
      </template>
    </ul>

    <ul x-data="{ colors: ['Red', 'Orange', 'Yellow','blue'] }">
      <template x-for="(color, index) in colors" :key="index">
        <li>
          <span x-text="index + ': '"></span>
          <span x-text="color"></span>
        </li>
      </template>
    </ul>

    <ul
      x-data="{
  mobiles: [
    { id: 1, name: 'iphone12', price: 20000 },
    { id: 2, name: 'iphone13', price: 30000 }
  ]
}"
    >
      <template x-for="i in 2" :key="i">
        <div>
          <li x-text="mobiles[i - 1]?.id"></li>
          <li x-text="mobiles[i - 1]?.price"></li>
          <li x-text="mobiles[i - 1]?.name"></li>
        </div>
      </template>
    </ul>

    <div x-data="{ open: false }">
      <button @click="open = ! open">Toggle</button>

      <!-- <div
        x-show="open"
        x-transition.duration.2000
        class="bg-indigo-500 text-white rounded-2xl ring-2 ring-indigo-500 text-2xl p-5 my-5 "
      >
        Hello 👋
      </div> -->
      <!-- <div
        x-show="open"
        x-transition:enter.duration.500
        x-transition:leave.duration.1000
        class="bg-indigo-500 text-white rounded-2xl ring-2 ring-indigo-500 text-2xl p-5 my-5"
      >
        Hello 👋
      </div> -->

      <!-- <div
        x-show="open"
        x-transition:enter.duration.500
        x-transition:leave.duration.1000
        class="bg-indigo-500 text-white rounded-2xl ring-2 ring-indigo-500 text-2xl p-5 my-5"
      >
        Hello 👋
      </div> -->

      <div
        x-show="open"
        x-transition.scale
        x-transition:enter.2000ms
        class="bg-indigo-500 text-white rounded-2xl ring-2 ring-indigo-500 text-2xl p-5 my-5"
      >
        Hello 👋
      </div>
    </div>

    <div x-data="{ open: false }">
      <button @click="open = ! open">Toggle</button>

      <div
        x-show="open"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-90"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-300"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-90"
      >
        Hello 👋
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
